{% extends 'base.html'%}
{% load static %}
{% block content%}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg p-3 mb-5 bg-white rounded">
                    <div class="card-body">
                        <h1 class="font text-center mb-4">Подтверждение почты</h1>

                        <!-- Сообщения об ошибках или успехе -->
                        {% if messages %}
                            <div class="messages">
                                {% for message in messages %}
                                    <div class="alert alert-{{ message.tags }}">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            </div>
                        {% endif %}

                        <!-- Форма для ввода кода подтверждения -->
                        <form method="post" class="mb-4">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="confirmation_code" class="form-label">Введите код подтверждения:</label>
                                <input type="text" id="confirmation_code" name="confirmation_code" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Подтвердить</button>
                        </form>

                        <!-- Кнопка для запроса нового кода -->
                        <form method="post" class="mb-4">
                            {% csrf_token %}
                            <input type="hidden" name="email" value="{{ pending_user.email }}">
                            <button type="submit" name="resend_code" class="btn btn-resend w-100">Отправить новый код</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
{% block footer %}{% endblock %}
