{% extends 'base.html'%}
{% load static %}
{% block bootstrap %}<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.dropdown-menu {
            background-color: #2c3e50;
            border: none;
            border-radius: 5px;
}
.dropdown-item {
            color: white;
            padding: 10px 20px;
}
.dropdown-item:hover {
            background-color: #34495e;
            color: white;
}
.nav_link--btn.dropdown-toggle {
            background-color: transparent;
            border: none;
        }
.dropdown-toggle::after {
            margin-left: 5px;
}
</style>{% endblock %}
{% block send_achievement %}{% endblock%}
{% block content%}
    <div class="conteiner font">
        <h2>Отправить грамоту</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_title">Название грамоты:</label>
                <input type="text" name="title" class="form-control" required id="id_title">
            </div>

            <div class="form-group">
                <label for="id_file">Файл грамоты:</label>
                <input type="file" name="file" class="form-control" required id="id_file">
            </div>

            <div class="form-group text-center">
                <button type="submit" class="btn btn-primary">Отправить</button>
            </div>
        </form>
    </div>

{% endblock %}
{% block footer %}{% endblock %}
